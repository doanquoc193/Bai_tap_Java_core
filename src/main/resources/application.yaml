server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /bank

spring:
  application:
    name: bank-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
